name: Android CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Needed so the release step can create a GitHub Release with the GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APKs (5 ABI variants)
        run: ./gradlew :app:assembleDebug --stacktrace

      # Decodes the keystore from the KEYSTORE_BASE64 secret into a temp file
      # and exports its path. If the secret is missing (e.g. PR from a fork),
      # the release build simply comes out unsigned.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Keystore decoded - release APKs will be signed."
          else
            echo "No KEYSTORE_BASE64 secret - release APKs will be unsigned."
          fi

      - name: Build release APKs (5 ABI variants, signed when secrets exist)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Rename APKs to a stable naming convention
        run: |
          mkdir -p artifacts
          for f in app/build/outputs/apk/debug/*.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.*)-debug\.apk$/\1/')
            cp "$f" "artifacts/CallManager-${abi}-debug.apk"
          done
          for f in app/build/outputs/apk/release/*.apk; do
            base=$(basename "$f")
            if [[ "$base" == *-release-unsigned.apk ]]; then
              abi=$(echo "$base" | sed -E 's/^app-(.*)-release-unsigned\.apk$/\1/')
              cp "$f" "artifacts/CallManager-${abi}-release-unsigned.apk"
            else
              abi=$(echo "$base" | sed -E 's/^app-(.*)-release\.apk$/\1/')
              cp "$f" "artifacts/CallManager-${abi}-release.apk"
            fi
          done
          echo "--- Collected artifacts ---"
          ls -la artifacts

      - name: Verify release APK signatures
        if: env.KEYSTORE_PATH != ''
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for f in artifacts/*-release.apk; do
            echo "--- $f ---"
            "$APKSIGNER" verify --print-certs "$f"
          done

      - name: Upload CallManager-arm64-v8a-debug
        uses: actions/upload-artifact@v6
        with:
          name: CallManager-arm64-v8a-debug
          path: artifacts/CallManager-arm64-v8a-debug.apk
          if-no-files-found: error

      - name: Upload CallManager-armeabi-v7a-debug
        uses: actions/upload-artifact@v6
        with:
          name: CallManager-armeabi-v7a-debug
          path: artifacts/CallManager-armeabi-v7a-debug.apk
          if-no-files-found: error

      - name: Upload CallManager-x86-debug
        uses: actions/upload-artifact@v6
        with:
          name: CallManager-x86-debug
          path: artifacts/CallManager-x86-debug.apk
          if-no-files-found: error

      - name: Upload CallManager-x86_64-debug
        uses: actions/upload-artifact@v6
        with:
          name: CallManager-x86_64-debug
          path: artifacts/CallManager-x86_64-debug.apk
          if-no-files-found: error

      - name: Upload CallManager-universal-debug
        uses: actions/upload-artifact@v6
        with:
          name: CallManager-universal-debug
          path: artifacts/CallManager-universal-debug.apk
          if-no-files-found: error

      - name: Upload CallManager-arm64-v8a-release
        uses: actions/upload-artifact@v6
        with:
          name: CallManager-arm64-v8a-release
          path: artifacts/CallManager-arm64-v8a-release*.apk
          if-no-files-found: error

      - name: Upload CallManager-armeabi-v7a-release
        uses: actions/upload-artifact@v6
        with:
          name: CallManager-armeabi-v7a-release
          path: artifacts/CallManager-armeabi-v7a-release*.apk
          if-no-files-found: error

      - name: Upload CallManager-x86-release
        uses: actions/upload-artifact@v6
        with:
          name: CallManager-x86-release
          path: artifacts/CallManager-x86-release*.apk
          if-no-files-found: error

      - name: Upload CallManager-x86_64-release
        uses: actions/upload-artifact@v6
        with:
          name: CallManager-x86_64-release
          path: artifacts/CallManager-x86_64-release*.apk
          if-no-files-found: error

      - name: Upload CallManager-universal-release
        uses: actions/upload-artifact@v6
        with:
          name: CallManager-universal-release
          path: artifacts/CallManager-universal-release*.apk
          if-no-files-found: error

      # Runs on every push to main (and on v* tags), never on pull requests.
      # The release tag is taken from versionName in app/build.gradle.kts
      # (e.g. v0.2.9), or is the pushed tag itself. If that Release already
      # exists, its APK is replaced with the fresh build instead of failing.
      # The Release gets every APK produced above: all 5 ABI variants
      # (universal, arm64-v8a, armeabi-v7a, x86, x86_64) of both the debug and
      # the release build (10 files). The release-build files are signed when
      # the signing secrets are configured, otherwise they are unsigned.
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            VERSION_NAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
            TAG="v${VERSION_NAME}"
          fi
          APKS=(artifacts/*.apk)

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${APKS[@]}" --clobber
          else
            gh release create "$TAG" "${APKS[@]}" \
              --target "$GITHUB_SHA" \
              --title "CallManager $TAG" \
              --generate-notes
          fi

# NOTE:
# Release APKs are signed in CI with the keystore stored in GitHub Secrets
# (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD). Without those
# secrets they come out unsigned (see app/build.gradle.kts).
# Since this app has no native (C/C++) code, all 5 ABI-specific APKs are
# currently byte-for-byte equivalent in functionality to the universal one;
# the split is wired up because it's a real build requirement and is
# already correct for whenever native code gets added later.
